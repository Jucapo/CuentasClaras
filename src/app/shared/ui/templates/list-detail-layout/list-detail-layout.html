<!-- Side by side each pane scrolls on its own; drag-and-drop scrolls them too (cdkScrollable). -->
<div class="list-pane" cdkScrollable [hidden]="!showList()">
  <ng-content select="[ccListPane]" />
</div>
<div class="detail-pane" cdkScrollable [hidden]="!showDetail()">
  <div class="detail" [hidden]="!detailOpen()">
    <ng-content select="[ccDetailPane]" />
  </div>
  <div class="detail-empty" [hidden]="detailOpen()">
    <ng-content select="[ccDetailEmpty]" />
  </div>
</div>
