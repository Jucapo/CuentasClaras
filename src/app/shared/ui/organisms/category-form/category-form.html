<cc-segmented-control
  class="kind"
  label="Clase"
  [fullWidth]="true"
  [options]="kindOptions"
  [formField]="fields().kind"
/>
<cc-text-field label="Nombre" placeholder="Mercado" [formField]="fields().name" />
<cc-select
  label="Categoría principal"
  hint="Elige una para que esta sea una subcategoría."
  [options]="parentOptions()"
  [formField]="fields().parentId"
/>
<div class="pair">
  <cc-icon-picker label="Ícono" [color]="previewColor()" [formField]="fields().icon" />
  <cc-color-picker label="Color" [inheritFrom]="parentColor()" [formField]="fields().color" />
</div>
<cc-chip-select
  label="Etiquetas por defecto"
  hint="Se aplican solas al registrar en esta categoría; puedes cambiarlas en el momento."
  emptyText="Aún no hay etiquetas. Créalas en Configuración → Etiquetas."
  [options]="tagOptions()"
  [formField]="fields().tagIds"
/>
