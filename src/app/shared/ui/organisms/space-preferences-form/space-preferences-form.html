<cc-text-field
  label="Nombre del espacio"
  placeholder="Hogar"
  [hint]="hints() ? 'Por ejemplo: Hogar o Personal.' : undefined"
  autocomplete="off"
  [formField]="fields().name"
/>
<cc-currency-select
  label="Moneda principal"
  [hint]="hints() ? 'Los totales se muestran en esta moneda.' : undefined"
  [formField]="fields().mainCurrency"
/>
<!-- The range of the month is worked out from the day: it stays everywhere. -->
<cc-select
  label="Primer día del mes"
  [hint]="monthHint()"
  [options]="monthDayOptions"
  [formField]="fields().monthStartDay"
/>
<cc-select
  label="Primer día de la semana"
  [options]="weekdayOptions"
  [formField]="fields().weekStart"
/>
