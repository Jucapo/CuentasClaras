<section class="list" [attr.aria-label]="label()">
  @for (group of groups(); track group.title) {
    <h3 class="day">{{ group.title }}</h3>
    <ul class="items">
      @for (item of group.items; track item.id) {
        <li>
          <cc-list-item
            [title]="item.title"
            [subtitle]="item.subtitle"
            [actionable]="item.editable"
            [selected]="item.id === selectedId()"
            (activate)="opened.emit(item.id)"
          >
            <cc-icon-badge ccListItemLeading [icon]="item.icon" [color]="item.color" />
            <span ccListItemTrailing class="trailing">
              @if (item.private) {
                <cc-icon class="lock" name="lock" size="sm" [label]="text.privateAccount" />
              }
              <cc-amount
                tone="neutral"
                [signed]="item.signed ?? true"
                [amount]="item.amount"
                [currency]="item.currency"
              />
            </span>
          </cc-list-item>
        </li>
      }
    </ul>
  } @empty {
    @if (!loading() && emptyText()) {
      <p class="empty">{{ emptyText() }}</p>
    }
  }

  @if (hasMore()) {
    <div class="more">
      <cc-button variant="text" loadingLabel="Cargando" [loading]="loading()" (click)="more.emit()">
        {{ text.loadMore }}
      </cc-button>
    </div>
  }
</section>
