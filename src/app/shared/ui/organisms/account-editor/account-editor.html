<cc-flow-hero>
  <cc-title-field
    ccHeroName
    label="Nombre"
    placeholder="Nombre de la cuenta"
    [autofocus]="autofocusName()"
    [formField]="fields().name"
  />
  <cc-appearance-picker
    ccHeroBadge
    iconContext="account"
    [itemName]="value().name"
    [label]="text.changeAppearance"
    [formField]="fields().icon"
    [(color)]="fields().color().value"
  />
</cc-flow-hero>

<section class="rows" [attr.aria-labelledby]="rowsTitleId">
  <h2 class="cc-visually-hidden" [id]="rowsTitleId">Cuenta</h2>
  <cc-field-row
    icon="category"
    label="Tipo"
    [valueText]="kindLabel()"
    [disabled]="fields().kind().disabled()"
    (activate)="pickKind()"
  />
  <cc-field-row
    icon="currency_exchange"
    label="Moneda"
    [valueText]="currencyText()"
    [disabled]="fields().currency().disabled()"
    (activate)="pickCurrency()"
  />
  <cc-money-row
    icon="account_balance"
    placeholder="0"
    [label]="balanceText().label"
    [hint]="balanceText().hint"
    [currency]="value().currency"
    [allowNegative]="allowNegativeBalance()"
    [formField]="fields().balance"
  />
  <cc-switch
    icon="functions"
    label="Incluir en el total"
    [row]="true"
    [formField]="fields().includeInTotal"
  />
  @if (showDefault()) {
    <cc-switch
      icon="star"
      label="Cuenta predeterminada"
      [row]="true"
      [formField]="fields().isDefault"
    />
  }

  <cc-disclosure class="more" [label]="text.moreOptions" [(open)]="moreOpen">
    <div class="date">
      <cc-date-field label="Fecha del saldo" [maxDate]="today" [formField]="fields().balanceDate" />
    </div>
    <cc-switch
      icon="lock"
      label="Cuenta privada"
      hint="Solo tú ves la cuenta, su saldo y sus movimientos."
      [row]="true"
      [formField]="fields().isPrivate"
    />
    @if (isPrivate()) {
      <cc-switch
        icon="group"
        label="Incluir sus movimientos en el espacio"
        hint="Los demás ven esos movimientos y cuentan en el presupuesto conjunto."
        [row]="true"
        [formField]="fields().includeInSpaceByDefault"
      />
    }
  </cc-disclosure>
</section>
