<cc-overlay-panel
  [title]="data.title"
  [confirmLabel]="text.done"
  confirmingLabel="Guardando"
  [confirming]="form().submitting()"
  (closed)="close()"
  (confirmed)="done()"
>
  <cc-form label="Etiqueta" [form]="form">
    <div class="identity">
      <cc-color-swatch [color]="form.color().value()" [label]="text.colorTab" [decorative]="true" />
      <cc-text-field class="name" label="Nombre" [formField]="form.name" />
    </div>
    <h3 class="cc-visually-hidden">{{ text.colorTab }}</h3>
    <cc-color-grid class="colors" [(value)]="form.color().value" />

    @if (categoryGroups.length > 0) {
      <cc-disclosure [label]="categoriesLabel()">
        <div class="categories">
          @for (group of categoryGroups; track group.label) {
            <h3 class="grid-title">{{ group.label }}</h3>
            <cc-category-checklist
              [label]="group.label"
              [nodes]="group.nodes"
              [selected]="form.categoryIds().value()"
              (selectedChange)="setCategories($event, group)"
            />
          }
        </div>
      </cc-disclosure>
    }

    @if (error(); as error) {
      <cc-message>{{ error }}</cc-message>
    }

    @if (data.actions; as actions) {
      <cc-form-actions align="start">
        <cc-button
          variant="outlined"
          [icon]="actions.archived ? 'unarchive' : 'archive'"
          (click)="act(actions.archived ? 'unarchive' : 'archive')"
        >
          {{ actions.archived ? 'Desarchivar' : 'Archivar' }}
        </cc-button>
        @if (actions.canDelete) {
          <cc-button variant="text" icon="delete" [danger]="true" (click)="act('delete')">
            Eliminar
          </cc-button>
        }
      </cc-form-actions>
    }
  </cc-form>
</cc-overlay-panel>
