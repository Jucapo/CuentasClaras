@if (reorderable() && entries().length > 1) {
  <p class="cc-visually-hidden" [id]="instructionsId">{{ instructions }}</p>
}

<div
  class="rows"
  role="list"
  cdkDropList
  cdkDropListLockAxis="y"
  [attr.aria-label]="label()"
  [cdkDropListDisabled]="!reorderable()"
  (cdkDropListDropped)="dropped($event)"
>
  @for (entry of entries(); track entry.id; let index = $index) {
    <div class="row" role="listitem" cdkDrag [cdkDragData]="entry.id">
      <cc-list-item
        [title]="entry.name"
        [subtitle]="entry.subtitle"
        [muted]="!!entry.muted"
        [actionable]="true"
        (activate)="opened.emit(entry.id)"
      >
        @if (reorderable()) {
          <button
            ccListItemStart
            cdkDragHandle
            type="button"
            class="handle"
            [attr.aria-label]="'Mover ' + entry.name"
            [attr.aria-describedby]="instructionsId"
            aria-keyshortcuts="Alt+ArrowUp Alt+ArrowDown"
            (keydown)="onHandleKeydown($event, index)"
          >
            <cc-icon name="drag_indicator" />
          </button>
        }
        <cc-icon-badge ccListItemLeading [icon]="entry.icon" [color]="entry.color" />
      </cc-list-item>
    </div>
  }
</div>

@if (addLabel(); as addLabel) {
  <cc-list-item class="add" [title]="addLabel" [actionable]="true" (activate)="add.emit()">
    <cc-icon ccListItemLeading class="add-icon" name="add" />
  </cc-list-item>
}
