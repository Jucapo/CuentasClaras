<mat-form-field
  class="field"
  [appearance]="appearance()"
  [subscriptSizing]="appearance() === 'outline' ? 'dynamic' : 'fixed'"
>
  @if (!hideLabel()) {
    <mat-label>{{ label() }}</mat-label>
  }
  @if (actionIcon() && align() === 'center') {
    <!-- Balances the action, so the centered text sits in the middle of the field. -->
    <span matPrefix class="spacer" aria-hidden="true"></span>
  }
  <input
    #input
    matInput
    [id]="controlId"
    [type]="type()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    [placeholder]="placeholder()"
    [errorStateMatcher]="errorStateMatcher"
    [attr.aria-label]="hideLabel() ? label() : null"
    [attr.name]="name() || null"
    [attr.autocomplete]="autocomplete()"
    [attr.inputmode]="inputMode() ?? null"
    [attr.maxlength]="maxLength() ?? null"
    (input)="onInput($event)"
    (blur)="touch.emit()"
  />
  @if (actionIcon(); as icon) {
    <cc-icon-button
      matSuffix
      class="action"
      [icon]="icon"
      [label]="actionLabel() ?? label()"
      (click)="action.emit()"
    />
  }
  @if (errorMessage(); as message) {
    <mat-error>{{ message }}</mat-error>
  } @else if (hint(); as hint) {
    <mat-hint>{{ hint }}</mat-hint>
  }
</mat-form-field>
