@if (link(); as commands) {
  <a
    matIconButton
    [routerLink]="commands"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    [attr.aria-label]="label()"
    [attr.aria-keyshortcuts]="shortcut() ?? null"
    [attr.title]="title()"
  >
    <mat-icon [fontSet]="iconFont" aria-hidden="true" [attr.data-icon]="icon()">{{
      glyph()
    }}</mat-icon>
  </a>
} @else {
  <button
    matIconButton
    type="button"
    [disabled]="disabled()"
    [attr.aria-label]="label()"
    [attr.aria-keyshortcuts]="shortcut() ?? null"
    [attr.title]="title()"
  >
    <mat-icon [fontSet]="iconFont" aria-hidden="true" [attr.data-icon]="icon()">{{
      glyph()
    }}</mat-icon>
  </button>
}
