<div
  mat-tab-nav-bar
  class="tab-bar"
  mat-stretch-tabs="true"
  [disablePagination]="true"
  [tabPanel]="panel"
  [attr.aria-label]="label()"
>
  @for (option of options(); track option.value) {
    <!-- A button inside forms must not submit them. -->
    <button
      type="button"
      mat-tab-link
      class="tab"
      [active]="option.value === value()"
      (click)="value.set(option.value)"
    >
      <span class="tab-content">
        @if (option.icon; as icon) {
          <cc-icon [name]="icon" size="sm" />
        }
        {{ option.label }}
      </span>
    </button>
  }
</div>
<mat-tab-nav-panel #panel class="panel">
  <ng-content />
</mat-tab-nav-panel>
