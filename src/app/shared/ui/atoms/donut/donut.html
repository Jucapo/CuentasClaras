<svg class="ring" aria-hidden="true" [attr.viewBox]="geometry.viewBox">
  <circle
    class="track"
    [attr.cx]="geometry.center"
    [attr.cy]="geometry.center"
    [attr.r]="geometry.radius"
    [attr.stroke-width]="geometry.stroke"
  />
  <!-- SVG circles start at 3 o'clock: the group turns them to start at the top. -->
  <g [attr.transform]="'rotate(-90 ' + geometry.center + ' ' + geometry.center + ')'">
    @for (arc of arcs(); track $index) {
      <circle
        class="segment"
        [attr.cx]="geometry.center"
        [attr.cy]="geometry.center"
        [attr.r]="geometry.radius"
        [attr.stroke-width]="geometry.stroke"
        [attr.stroke-dasharray]="arc.dasharray"
        [attr.stroke-dashoffset]="arc.dashoffset"
        [style.stroke]="arc.color"
      />
    }
  </g>
</svg>
<div class="center"><ng-content /></div>
