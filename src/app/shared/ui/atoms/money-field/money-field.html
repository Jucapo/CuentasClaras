<!-- The label always floats so it never sits next to the currency symbol. -->
<mat-form-field class="field" floatLabel="always">
  <mat-label>{{ label() }}</mat-label>
  <span matTextPrefix class="symbol">{{ symbol() }}&nbsp;</span>
  <input
    #input
    matInput
    class="amount"
    type="text"
    inputmode="decimal"
    autocomplete="off"
    [id]="controlId"
    [value]="text()"
    [disabled]="disabled()"
    [required]="required()"
    [placeholder]="placeholder()"
    [errorStateMatcher]="errorStateMatcher"
    [attr.name]="name() || null"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  @if (errorMessage(); as message) {
    <mat-error>{{ message }}</mat-error>
  } @else if (hint(); as hint) {
    <mat-hint>{{ hint }}</mat-hint>
  }
</mat-form-field>
