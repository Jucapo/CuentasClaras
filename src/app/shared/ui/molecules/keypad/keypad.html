<div class="keys" role="group" [attr.aria-label]="label">
  @for (button of upperKeys(); track button.key) {
    <ng-container [ngTemplateOutlet]="key" [ngTemplateOutletContext]="{ $implicit: button }" />
  }
  @if (dateKey()) {
    <button
      type="button"
      class="key operator"
      tabindex="-1"
      data-key="date"
      [attr.aria-label]="dateLabel"
      (click)="dateRequested.emit()"
    >
      <cc-icon name="calendar_month" />
    </button>
  }
  @for (button of lowerKeys(); track button.key) {
    <ng-container [ngTemplateOutlet]="key" [ngTemplateOutletContext]="{ $implicit: button }" />
  }
  <button
    type="button"
    class="key submit"
    data-key="submit"
    [attr.aria-label]="submitLabel()"
    [disabled]="submitDisabled()"
    (click)="submitted.emit()"
  >
    <cc-icon name="check" />
  </button>
</div>

<ng-template #key let-button>
  <button
    type="button"
    class="key"
    tabindex="-1"
    [class.operator]="button.kind === 'operator'"
    [class.span-2]="button.span === 2"
    [class.tall]="button.tall"
    [attr.aria-label]="button.label ?? null"
    [attr.data-key]="button.key"
    (click)="pressed.emit(button.key)"
  >
    @if (button.icon; as icon) {
      <cc-icon [name]="icon" />
    } @else {
      {{ button.text }}
    }
  </button>
</ng-template>
