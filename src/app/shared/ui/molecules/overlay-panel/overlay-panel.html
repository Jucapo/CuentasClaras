@if (inSheet) {
  <cc-sheet-handle
    class="sheet-handle"
    [label]="closesWithHandle() ? handleLabel() : null"
    (activate)="closed.emit()"
  />
}
@if (floating()) {
  <h2 class="cc-visually-hidden" [id]="titleId">{{ title() }}</h2>
} @else {
  <header class="header">
    @if (backButton()) {
      <cc-icon-button icon="arrow_back" [label]="backLabel" (click)="back.emit()" />
    } @else if (!hideClose()) {
      <cc-icon-button icon="close" [label]="closeLabel" (click)="closed.emit()" />
    }
    <h2 class="title" [id]="titleId">{{ title() }}</h2>
  </header>
}
<div class="hero"><ng-content select="[ccOverlayHero]" /></div>
<div class="toolbar"><ng-content select="[ccOverlayToolbar]" /></div>
<div class="body" [attr.aria-labelledby]="titleId" role="group">
  <ng-content />
</div>
<div class="actions"><ng-content select="[ccOverlayActions]" /></div>
@if (floating() && !hideClose() && !closesWithHandle()) {
  <cc-icon-button
    class="floating-close"
    [class.at-top]="closeAtTop()"
    icon="close"
    [label]="closeLabel"
    [tooltip]="true"
    (click)="closed.emit()"
  />
}
@if (confirmLabel(); as label) {
  <cc-fab
    class="floating-confirm"
    icon="check"
    shortcut="Control+S Meta+S"
    [label]="label"
    [loading]="confirming()"
    [loadingLabel]="confirmingLabel()"
    (click)="confirm()"
  />
}
