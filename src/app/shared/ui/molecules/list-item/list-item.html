<ng-content select="[ccListItemStart]" />
@if (link(); as commands) {
  <a
    class="main"
    matRipple
    [class.selected]="selected()"
    [attr.aria-current]="selected() ? 'true' : null"
    [routerLink]="commands"
    [queryParams]="queryParams()"
  >
    <ng-container [ngTemplateOutlet]="content" />
    <cc-icon class="chevron" name="chevron_right" size="sm" />
  </a>
} @else if (actionable()) {
  <button
    type="button"
    class="main"
    matRipple
    aria-haspopup="dialog"
    [class.selected]="selected()"
    (click)="activate.emit()"
  >
    <ng-container [ngTemplateOutlet]="content" />
    <cc-icon class="chevron" name="chevron_right" size="sm" />
  </button>
} @else {
  <div class="main">
    <ng-container [ngTemplateOutlet]="content" />
  </div>
}
<ng-content select="[ccListItemEnd]" />

<ng-template #content>
  <span class="leading"><ng-content select="[ccListItemLeading]" /></span>
  <span class="texts">
    <span class="title">{{ title() }}</span>
    @if (subtitle(); as subtitle) {
      <span class="subtitle">
        @if (subtitleIcon(); as icon) {
          <cc-icon class="subtitle-icon" size="sm" [name]="iconName(icon)" />
        }
        <span class="subtitle-text">{{ subtitle }}</span>
      </span>
    }
    @if (note(); as note) {
      <span class="note">{{ note }}</span>
    }
  </span>
  <span class="trailing"><ng-content select="[ccListItemTrailing]" /></span>
</ng-template>
