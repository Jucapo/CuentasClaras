<cc-overlay-panel
  [title]="data.title"
  [confirmLabel]="text.done"
  (closed)="close()"
  (confirmed)="done()"
>
  <cc-appearance-editor
    [(icon)]="icon"
    [(color)]="color"
    [inheritFrom]="data.inheritFrom"
    [iconContext]="data.iconContext ?? null"
    [itemName]="data.itemName ?? ''"
  />
</cc-overlay-panel>
