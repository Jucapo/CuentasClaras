@switch (variant()) {
  @case ('view') {
    <button
      type="button"
      class="bubble interactive"
      [attr.aria-label]="accessibleName()"
      (click)="activate.emit()"
    >
      <span class="name">{{ name() }}</span>
      @if (currency(); as currency) {
        @if (reserveRemaining() || remaining() !== null) {
          <span class="remaining" [class.over]="over()">
            @if (remaining() !== null) {
              <cc-amount [amount]="remaining() ?? 0" [currency]="currency" tone="neutral" />
            }
          </span>
        }
      }
      <span
        class="ring"
        [class.with-progress]="ringProgress() !== null"
        [class.over]="over()"
        [style.--cc-bubble-color]="ringColor()"
        [style.--cc-bubble-progress]="ringProgress()"
      >
        <cc-icon-badge size="lg" [icon]="icon()" [color]="color()" />
        @if (over()) {
          <cc-icon class="over-mark" name="error" size="sm" [label]="overLabel" />
        }
      </span>
      @if (currency(); as currency) {
        <span class="spent" [style.color]="spentColor()">
          @if (amount() !== null) {
            <cc-amount [amount]="amount() ?? 0" [currency]="currency" tone="neutral" />
          }
        </span>
      }
    </button>
  }
  @case ('edit') {
    <button
      type="button"
      class="bubble interactive"
      [attr.aria-current]="selected() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-keyshortcuts]="keyShortcuts()"
      (click)="activate.emit()"
    >
      <span class="name">{{ name() }}</span>
      <cc-icon-badge size="lg" [icon]="icon()" [color]="color()" />
    </button>
  }
  @case ('add') {
    <button type="button" class="bubble interactive" (click)="activate.emit()">
      <span class="name">{{ name() }}</span>
      <span class="add-circle"><cc-icon name="add" size="lg" /></span>
    </button>
  }
}
