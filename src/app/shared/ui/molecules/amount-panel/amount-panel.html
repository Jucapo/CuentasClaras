<cc-overlay-panel [title]="data.title" (closed)="close()">
  <cc-button ccOverlayHeaderAction (click)="done()">{{ text.done }}</cc-button>
  <cc-form [form]="form">
    <cc-money-field
      [label]="data.label"
      [currency]="data.currency"
      [allowNegative]="data.allowNegative ?? false"
      [hint]="data.hint"
      [formField]="form.amount"
    />
  </cc-form>
</cc-overlay-panel>
