<button
  type="button"
  class="trigger"
  aria-haspopup="dialog"
  [class.invalid]="!!error()"
  [disabled]="disabled()"
  [attr.aria-describedby]="error() || hint() ? supportId : null"
  (click)="activate.emit()"
  (blur)="blurred.emit()"
>
  <span class="preview"><ng-content /></span>
  <span class="texts">
    <span class="label">{{ label() }}</span>
    <span class="value">{{ valueText() }}</span>
  </span>
  <cc-icon class="chevron" name="expand_more" />
</button>
@if (error(); as error) {
  <p class="support error" role="alert" [id]="supportId">{{ error }}</p>
} @else if (hint(); as hint) {
  <p class="support" [id]="supportId">{{ hint }}</p>
}
