<cc-overlay-panel [title]="data.title" (closed)="close()">
  <div class="grid">
    @if (data.allowInherit) {
      <cc-color-swatch
        [color]="null"
        [label]="inheritLabel"
        [selected]="data.selected === null"
        (click)="pick(null)"
      />
    }
    @for (color of palette; track color.key) {
      <cc-color-swatch
        [color]="color.key"
        [label]="color.label"
        [selected]="color.key === data.selected"
        [attr.data-color]="color.key"
        (click)="pick(color.key)"
      />
    }
  </div>
</cc-overlay-panel>
