<section class="section" [attr.aria-labelledby]="titleId">
  @if (hideTitle() && !description()) {
    <h2 class="cc-visually-hidden" [id]="titleId">{{ title() }}</h2>
  } @else {
    <header class="header">
      <h2 [class]="hideTitle() ? 'cc-visually-hidden' : 'title'" [id]="titleId">{{ title() }}</h2>
      @if (description(); as description) {
        <p class="description">{{ description }}</p>
      }
    </header>
  }
  <ng-content />
</section>
