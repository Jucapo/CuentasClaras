<span class="label" [class.cc-visually-hidden]="hideLabel()" [id]="labelId">{{ label() }}</span>
<mat-chip-listbox
  #listbox
  class="cc-chip-row"
  [attr.aria-labelledby]="labelId"
  [value]="value()"
  [disabled]="disabled()"
  [hideSingleSelectionIndicator]="true"
  (change)="onChange($event, listbox)"
>
  @for (option of options(); track option.value) {
    <mat-chip-option [value]="option.value">
      <span class="chip-label">
        @if (option.color; as color) {
          <cc-color-swatch
            [color]="color"
            [label]="option.label"
            [decorative]="true"
            [small]="true"
          />
        }
        {{ option.label }}
      </span>
    </mat-chip-option>
  }
</mat-chip-listbox>
@if (errorMessage(); as message) {
  <p class="support error" role="alert">{{ message }}</p>
} @else if (hint(); as hint) {
  <p class="support">{{ hint }}</p>
}
