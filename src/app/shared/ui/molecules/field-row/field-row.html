<button
  type="button"
  class="row"
  aria-haspopup="dialog"
  [class.invalid]="!!error()"
  [disabled]="disabled()"
  [attr.aria-describedby]="error() || hint() ? supportId : null"
  (click)="activate.emit()"
>
  <span class="leading">
    @if (icon(); as icon) {
      <cc-icon class="icon" [name]="icon" />
    } @else {
      <ng-content />
    }
  </span>
  <span class="texts">
    <span class="label">{{ label() }}</span>
    <span class="value">{{ valueText() }}</span>
  </span>
  <cc-icon class="chevron" name="chevron_right" size="sm" />
</button>
@if (error(); as error) {
  <p class="support error" role="alert" [id]="supportId">{{ error }}</p>
} @else if (hint(); as hint) {
  <p class="support" [id]="supportId">{{ hint }}</p>
}
