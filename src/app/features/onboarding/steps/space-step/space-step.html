<cc-form [form]="stepForm">
  <cc-wizard-step [title]="step.title" [help]="step.help">
    <cc-space-preferences-form [fields]="stepForm.space" />
    <cc-number-format-form [fields]="stepForm.numberFormat" />

    <app-step-actions
      ccWizardStepActions
      action="submit"
      [step]="step.id"
      [busy]="stepForm().submitting()"
      [busyLabel]="busyLabel()"
      [error]="errorMessage()"
    />
  </cc-wizard-step>
</cc-form>
