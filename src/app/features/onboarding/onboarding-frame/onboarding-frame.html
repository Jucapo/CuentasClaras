<cc-wizard-layout [steps]="steps()" [progress]="progress()" [immersive]="immersive()">
  <cc-button
    ccWizardActions
    variant="text"
    [loadingLabel]="exitBusyLabel()"
    [loading]="leaving()"
    (click)="leave()"
  >
    {{ exitLabel() }}
  </cc-button>
  <router-outlet />
</cc-wizard-layout>
