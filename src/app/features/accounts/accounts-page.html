<cc-list-detail-layout [detailOpen]="detailOpen()">
  <div ccListPane class="list">
    <cc-page-header title="Cuentas">
      @if (canEdit()) {
        <cc-icon-button icon="add" label="Nueva cuenta" shortcut="N" (click)="create()" />
      }
    </cc-page-header>

    @if (loadError(); as error) {
      <cc-message>{{ error }}</cc-message>
    } @else if (isEmpty()) {
      <cc-section
        title="Aún no tienes cuentas"
        description="Agrega tu efectivo, bancos, ahorros, tarjetas y deudas con su saldo actual."
      >
        @if (canEdit()) {
          <cc-button icon="add" (click)="create()">Agregar una cuenta</cc-button>
        }
      </cc-section>
    } @else {
      <cc-account-list [groups]="groups()" [totals]="totals()" />
    }

    @if (hasArchived()) {
      <cc-disclosure [label]="archivedLabel()">
        <cc-account-list [groups]="archivedGroups()" />
      </cc-disclosure>
    }
  </div>

  <div ccDetailPane class="detail">
    <router-outlet (activate)="onActivate($event)" (deactivate)="onDeactivate()" />
  </div>

  <div ccDetailEmpty class="empty-detail">
    <cc-icon name="account_balance_wallet" size="xl" />
    <p class="empty-text">Elige una cuenta para verla, o crea una nueva.</p>
    @if (canEdit()) {
      <cc-button icon="add" variant="tonal" shortcut="N" (click)="create()">Nueva cuenta</cc-button>
    }
  </div>
</cc-list-detail-layout>
