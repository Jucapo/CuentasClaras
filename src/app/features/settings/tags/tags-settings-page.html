<cc-page-header title="Etiquetas" [backLink]="backLink" backLabel="Volver a Configuración">
  @if (canEdit()) {
    <cc-icon-button icon="add" label="Nueva etiqueta" shortcut="N" (click)="open(null)" />
  }
</cc-page-header>

<div class="content">
  @if (loadError(); as error) {
    <cc-message>{{ error }}</cc-message>
  } @else if (isEmpty()) {
    <cc-section
      title="Aún no hay etiquetas"
      description="Las etiquetas agrupan movimientos de distintas categorías, como «Fijos» o «Salud»."
    >
      @if (canEdit()) {
        <cc-button icon="add" (click)="open(null)">Crear una etiqueta</cc-button>
      }
    </cc-section>
  } @else {
    <cc-tag-list [tags]="active()" [actionable]="canEdit()" (opened)="open($event)" />
  }

  @if (archived().length > 0) {
    <cc-disclosure [label]="archivedLabel()">
      <cc-tag-list [tags]="archived()" [actionable]="canEdit()" (opened)="open($event)" />
    </cc-disclosure>
  }
</div>
