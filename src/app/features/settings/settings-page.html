<cc-page-header title="Configuración" />

<div class="sections">
  <cc-section title="Espacio" [description]="spaceDescription()">
    <cc-form label="Espacio" [form]="spaceForm">
      <div class="space-appearance">
        <cc-appearance-picker
          label="Ícono y color del espacio"
          size="lg"
          iconContext="space"
          [itemName]="spaceForm.space.name().value()"
          [formField]="spaceForm.icon"
          [(color)]="spaceForm.color().value"
        />
        <span class="space-appearance-label">Ícono y color</span>
      </div>
      <cc-space-preferences-form [fields]="spaceForm.space" />
      @if (canConfigure()) {
        <cc-form-actions align="end" [error]="spaceError()">
          <cc-button type="submit" loadingLabel="Guardando" [loading]="spaceForm().submitting()">
            Guardar
          </cc-button>
        </cc-form-actions>
      }
    </cc-form>
  </cc-section>

  @if (canConfigure()) {
    <cc-section
      title="Configuración inicial"
      description="El asistente que guía la configuración del espacio."
    >
      <div role="list">
        <cc-list-item
          role="listitem"
          [title]="onboardingRow().title"
          [subtitle]="onboardingRow().subtitle"
          [link]="onboardingLink"
        >
          <cc-icon ccListItemLeading name="auto_awesome" />
        </cc-list-item>
      </div>
    </cc-section>
  }

  <cc-section
    title="Catálogos"
    description="Las cuentas, categorías, etiquetas y tasas de cambio del espacio."
  >
    <div role="list">
      <cc-list-item
        role="listitem"
        title="Cuentas"
        subtitle="Saldos, cuentas privadas y la predeterminada"
        [link]="catalogLinks.accounts"
      >
        <cc-icon ccListItemLeading name="account_balance_wallet" />
      </cc-list-item>
      <cc-list-item
        role="listitem"
        title="Categorías"
        subtitle="De gasto y de ingreso, con subcategorías"
        [link]="catalogLinks.categories"
      >
        <cc-icon ccListItemLeading name="category" />
      </cc-list-item>
      <cc-list-item
        role="listitem"
        title="Etiquetas"
        subtitle="Agrupan movimientos de distintas categorías"
        [link]="catalogLinks.tags"
      >
        <cc-icon ccListItemLeading name="label" />
      </cc-list-item>
      <cc-list-item
        role="listitem"
        title="Monedas"
        subtitle="Tasas de cambio para los totales en la moneda principal"
        [link]="catalogLinks.currencies"
      >
        <cc-icon ccListItemLeading name="currency_exchange" />
      </cc-list-item>
    </div>
  </cc-section>

  <cc-section title="Preferencias" description="Solo para ti, en todos tus espacios.">
    <cc-form label="Preferencias" [form]="preferencesForm">
      <cc-select label="Tema" [options]="themeOptions" [formField]="preferencesForm.theme" />
      <cc-number-format-form [fields]="preferencesForm.numberFormat" />
      @if (!layout.isCompact()) {
        <!-- Device preference: applies at once, outside the saved preferences (spec §13.5). -->
        <cc-switch
          icon="keyboard"
          [row]="true"
          label="Atajos de teclado"
          hint="N crea y E edita las categorías. Se guarda en este dispositivo."
          [checked]="shortcuts.singleKeyEnabled()"
          (checkedChange)="shortcuts.setSingleKeyEnabled($event)"
        />
      }
      <cc-form-actions align="end" [error]="preferencesError()">
        <cc-button
          type="submit"
          loadingLabel="Guardando"
          [loading]="preferencesForm().submitting()"
        >
          Guardar
        </cc-button>
      </cc-form-actions>
    </cc-form>
  </cc-section>

  <cc-section title="Sesión" [description]="sessionDescription()">
    <cc-form-actions align="start">
      <cc-button
        variant="outlined"
        icon="logout"
        loadingLabel="Cerrando sesión"
        [loading]="signingOut()"
        (click)="signOut()"
      >
        Cerrar sesión
      </cc-button>
    </cc-form-actions>
  </cc-section>
</div>
