<cc-page-header title="Configuración" [backAction]="true" (back)="goBack()" />

<div class="sections">
  <cc-section title="Tu perfil">
    <cc-form label="Tu perfil" [form]="profileForm">
      <cc-text-field
        label="Nombre visible"
        autocomplete="name"
        [formField]="profileForm.displayName"
      />
      <cc-form-actions align="end" [error]="profileError()">
        <cc-button type="submit" loadingLabel="Guardando" [loading]="profileForm().submitting()">
          Guardar
        </cc-button>
      </cc-form-actions>
    </cc-form>
  </cc-section>

  <!-- The theme changes right away from the menu (spec §7). -->
  <cc-section title="Preferencias">
    <cc-form label="Preferencias" [form]="preferencesForm">
      <cc-select
        label="Pantalla de inicio"
        [options]="homeScreenOptions"
        [formField]="preferencesForm.homeScreen"
      />
      <cc-number-format-form [fields]="preferencesForm.numberFormat" [hints]="false" />
      @if (!layout.isCompact()) {
        <!-- Device preference: applies at once, outside the saved preferences (spec §13.5). -->
        <cc-switch
          icon="keyboard"
          [row]="true"
          label="Atajos de teclado"
          hint="N crea y E edita las categorías. Se guarda en este dispositivo."
          [checked]="shortcuts.singleKeyEnabled()"
          (checkedChange)="shortcuts.setSingleKeyEnabled($event)"
        />
      }
      <cc-form-actions align="end" [error]="preferencesError()">
        <cc-button
          type="submit"
          loadingLabel="Guardando"
          [loading]="preferencesForm().submitting()"
        >
          Guardar
        </cc-button>
      </cc-form-actions>
    </cc-form>
  </cc-section>

  <cc-section title="Espacio" [description]="spaceDescription()">
    <cc-form label="Espacio" [form]="spaceForm">
      <div class="space-appearance">
        <cc-appearance-picker
          label="Ícono y color del espacio"
          size="lg"
          iconContext="space"
          [itemName]="spaceForm.space.name().value()"
          [formField]="spaceForm.icon"
          [(color)]="spaceForm.color().value"
        />
        <span class="space-appearance-label">Ícono y color</span>
      </div>
      <cc-space-preferences-form [fields]="spaceForm.space" [hints]="false" />
      <cc-select
        label="Periodo por defecto"
        [options]="defaultPeriodOptions"
        [formField]="spaceForm.defaultPeriod"
      />
      <cc-switch
        icon="savings"
        [row]="true"
        label="Mostrar presupuestos"
        [formField]="spaceForm.budgetsEnabled"
      />
      @if (canConfigure()) {
        <cc-form-actions align="end" [error]="spaceError()">
          <cc-button type="submit" loadingLabel="Guardando" [loading]="spaceForm().submitting()">
            Guardar
          </cc-button>
        </cc-form-actions>
      }
    </cc-form>

    <div role="list">
      <cc-list-item
        role="listitem"
        title="Miembros e invitaciones"
        [subtitle]="membersSummary()"
        [link]="membersLink"
      >
        <cc-icon ccListItemLeading name="group" />
      </cc-list-item>
      @if (canConfigure()) {
        <cc-list-item
          role="listitem"
          [title]="onboardingRow().title"
          [subtitle]="onboardingRow().subtitle"
          [link]="onboardingLink"
        >
          <cc-icon ccListItemLeading name="auto_awesome" />
        </cc-list-item>
      }
    </div>
  </cc-section>

  <cc-section title="Catálogos">
    <div role="list">
      <cc-list-item role="listitem" title="Cuentas" [link]="catalogLinks.accounts">
        <cc-icon ccListItemLeading name="account_balance_wallet" />
      </cc-list-item>
      <cc-list-item role="listitem" title="Categorías" [link]="catalogLinks.categories">
        <cc-icon ccListItemLeading name="category" />
      </cc-list-item>
      <cc-list-item role="listitem" title="Etiquetas" [link]="catalogLinks.tags">
        <cc-icon ccListItemLeading name="label" />
      </cc-list-item>
      <cc-list-item role="listitem" title="Monedas" [link]="catalogLinks.currencies">
        <cc-icon ccListItemLeading name="currency_exchange" />
      </cc-list-item>
    </div>
  </cc-section>
</div>
