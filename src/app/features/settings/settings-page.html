<cc-page-header title="Configuración" />

<cc-section title="Sesión" [description]="sessionDescription()">
  <cc-form-actions align="start">
    <cc-button
      variant="outlined"
      icon="logout"
      loadingLabel="Cerrando sesión"
      [loading]="signingOut()"
      (click)="signOut()"
    >
      Cerrar sesión
    </cc-button>
  </cc-form-actions>
</cc-section>
