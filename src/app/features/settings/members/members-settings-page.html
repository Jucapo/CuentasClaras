<cc-page-header title="Miembros" [backLink]="backLink" backLabel="Volver a Configuración">
  @if (canConfigure()) {
    <cc-icon-button icon="person_add" label="Invitar" shortcut="N" (click)="invite()" />
  }
</cc-page-header>

<div class="content">
  @if (loadError(); as error) {
    <cc-message>{{ error }}</cc-message>
  }

  <cc-section [title]="membersTitle()" [hideTitle]="true" [description]="membersDescription()">
    <cc-member-list
      [members]="memberEntries()"
      (roleRequested)="openRole($event)"
      (removeRequested)="remove($event)"
    />
  </cc-section>

  @if (canConfigure() && invitationEntries().length > 0) {
    <cc-section title="Invitaciones pendientes">
      <cc-invitation-list
        [invitations]="invitationEntries()"
        (resendRequested)="resend($event)"
        (revokeRequested)="revoke($event)"
      />
    </cc-section>
  }

  <cc-section title="Salir del espacio" [hideTitle]="true" [description]="leaveDescription()">
    <div class="actions">
      <cc-button
        variant="outlined"
        icon="logout"
        [danger]="true"
        [disabled]="!canLeave()"
        (click)="leave()"
      >
        Salir de {{ spaceName() }}
      </cc-button>
    </div>
  </cc-section>
</div>
