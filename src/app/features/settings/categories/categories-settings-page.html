<cc-page-header title="Categorías" [backLink]="backLink" backLabel="Volver a Configuración">
  @if (canEdit()) {
    <cc-button icon="add" variant="tonal" [link]="newLink" [queryParams]="newParams()">
      Nueva
    </cc-button>
  }
</cc-page-header>

<div class="content">
  <cc-segmented-control
    label="Clase de categorías"
    [fullWidth]="true"
    [options]="kindOptions"
    [value]="kind()"
    (valueChange)="changeKind($event)"
  />

  @if (loadError(); as error) {
    <cc-message>{{ error }}</cc-message>
  } @else if (isEmpty()) {
    <cc-section
      title="Aún no hay categorías"
      description="Crea las categorías y subcategorías con las que vas a clasificar tus movimientos."
    />
  } @else {
    <cc-category-list [nodes]="nodes()" [reorderable]="canEdit()" (reorder)="reorder($event)" />
  }

  @if (archived().length > 0) {
    <cc-section title="Archivadas" description="No se ofrecen al registrar; puedes restaurarlas.">
      <cc-category-list [nodes]="archived()" />
    </cc-section>
  }
</div>
