@if (sentTo(); as email) {
  <cc-page-header title="Crear cuenta" />
  <cc-message tone="info">
    Te enviamos un correo a <strong>{{ email }}</strong>. Abre el enlace para confirmar tu cuenta y
    luego inicia sesión.
  </cc-message>
  <cc-form-actions>
    <cc-button ccSecondaryAction variant="text" [link]="['/', paths.login]">
      Ya tengo cuenta
    </cc-button>
  </cc-form-actions>
} @else {
  <cc-page-header title="Crear cuenta" subtitle="Regístrate con tu correo." />

  <cc-form [form]="registerForm">
    <cc-text-field
      label="Correo"
      type="email"
      autocomplete="email"
      [formField]="registerForm.email"
    />
    <cc-password-field
      label="Contraseña"
      autocomplete="new-password"
      [formField]="registerForm.password"
    />
    <cc-password-field
      label="Confirmar contraseña"
      autocomplete="new-password"
      [formField]="registerForm.confirmPassword"
    />

    <cc-form-actions [error]="errorMessage()">
      <cc-button
        type="submit"
        loadingLabel="Creando cuenta"
        [loading]="registerForm().submitting()"
      >
        Crear cuenta
      </cc-button>
      <cc-button ccSecondaryAction variant="text" [link]="['/', paths.login]">
        Ya tengo cuenta
      </cc-button>
    </cc-form-actions>
  </cc-form>
}
