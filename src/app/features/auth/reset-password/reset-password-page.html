@if (hasSession()) {
  <cc-page-header title="Nueva contraseña" subtitle="Elige una contraseña nueva para tu cuenta." />

  <cc-form [form]="resetForm">
    <cc-password-field
      label="Nueva contraseña"
      autocomplete="new-password"
      [formField]="resetForm.password"
    />
    <cc-password-field
      label="Confirmar contraseña"
      autocomplete="new-password"
      [formField]="resetForm.confirmPassword"
    />

    <cc-form-actions [error]="errorMessage()">
      <cc-button type="submit" loadingLabel="Guardando" [loading]="resetForm().submitting()">
        Guardar contraseña
      </cc-button>
    </cc-form-actions>
  </cc-form>
} @else {
  <cc-page-header title="Nueva contraseña" />
  <cc-message>
    El enlace no es válido o ya venció. Solicita uno nuevo para restablecer tu contraseña.
  </cc-message>
  <cc-form-actions>
    <cc-button ccSecondaryAction variant="text" [link]="['/', paths.forgotPassword]">
      Solicitar un enlace nuevo
    </cc-button>
    <cc-button ccSecondaryAction variant="text" [link]="['/', paths.login]">
      Iniciar sesión
    </cc-button>
  </cc-form-actions>
}
