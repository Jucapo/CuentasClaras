<cc-page-header title="Iniciar sesión" subtitle="Entra con tu correo y contraseña." />

<cc-form [form]="loginForm">
  <cc-text-field label="Correo" type="email" autocomplete="email" [formField]="loginForm.email" />
  <cc-password-field
    label="Contraseña"
    autocomplete="current-password"
    [formField]="loginForm.password"
  />

  <cc-form-actions [error]="errorMessage()">
    <cc-button type="submit" loadingLabel="Entrando" [loading]="loginForm().submitting()">
      Entrar
    </cc-button>
    <cc-button ccSecondaryAction variant="text" [link]="['/', paths.forgotPassword]">
      ¿Olvidaste tu contraseña?
    </cc-button>
    @if (publicSignup) {
      <cc-button ccSecondaryAction variant="text" [link]="['/', paths.register]">
        Crear cuenta
      </cc-button>
    }
  </cc-form-actions>
</cc-form>
