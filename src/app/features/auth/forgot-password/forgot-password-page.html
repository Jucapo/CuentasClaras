@if (sentTo(); as email) {
  <cc-page-header title="Recuperar contraseña" />
  <cc-message tone="info">
    Si <strong>{{ email }}</strong> tiene una cuenta, te enviamos un enlace para definir una nueva
    contraseña. Revisa tu correo (también la carpeta de spam).
  </cc-message>
  <cc-form-actions>
    <cc-button ccSecondaryAction variant="text" [link]="['/', paths.login]">
      Volver a iniciar sesión
    </cc-button>
  </cc-form-actions>
} @else {
  <cc-page-header
    title="Recuperar contraseña"
    subtitle="Te enviaremos un enlace para definir una nueva contraseña."
  />

  <cc-form [form]="forgotForm">
    <cc-text-field
      label="Correo"
      type="email"
      autocomplete="email"
      [formField]="forgotForm.email"
    />

    <cc-form-actions [error]="errorMessage()">
      <cc-button type="submit" loadingLabel="Enviando" [loading]="forgotForm().submitting()">
        Enviar enlace
      </cc-button>
      <cc-button ccSecondaryAction variant="text" [link]="['/', paths.login]">
        Volver a iniciar sesión
      </cc-button>
    </cc-form-actions>
  </cc-form>
}
