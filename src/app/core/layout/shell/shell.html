<cc-app-shell
  [navItems]="navItems"
  navLabel="Navegación principal"
  totalLabel="Total"
  [total]="total()"
  periodLabel="Periodo"
  [immersive]="routeFlags().flow"
  [wideContent]="routeFlags().listDetail"
>
  <cc-period-chip
    ccShellPeriod
    [title]="periods.title()"
    [range]="periods.rangeText()"
    [canShift]="periods.canShift()"
    (previous)="periods.previous()"
    (next)="periods.next()"
    (opened)="choosePeriod()"
  />
  @if (spaceIcon(); as icon) {
    <cc-icon-button
      ccShellActions
      [icon]="icon"
      [label]="spaceLabel()"
      [tooltip]="true"
      (click)="chooseSpace()"
    />
  }
  <cc-icon-button
    ccShellActions
    icon="settings"
    label="Configuración"
    [link]="['/', paths.settings]"
  />
  <router-outlet />
</cc-app-shell>
