<cc-app-shell
  [primary]="true"
  [navItems]="navItems"
  [navLabel]="text.navigation"
  [totalLabel]="text.total"
  [total]="total()"
  [loadingLabel]="text.loading"
  [periodLabel]="text.period"
  [menuLabel]="text.menu"
  [userName]="userName()"
  [immersive]="routeFlags().flow"
  [subscreen]="routeFlags().subscreen"
  [wideContent]="routeFlags().listDetail"
  (menuOpened)="openMenu()"
>
  <cc-period-chip
    ccShellPeriod
    [title]="periods.title()"
    [range]="periods.rangeText()"
    [canShift]="periods.canShift()"
    (previous)="periods.previous()"
    (next)="periods.next()"
    (opened)="choosePeriod()"
  />
  <router-outlet />
</cc-app-shell>
