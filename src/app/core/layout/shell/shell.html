<cc-app-shell
  [navItems]="navItems"
  navLabel="Navegación principal"
  totalLabel="Total"
  [total]="total()"
  periodLabel="Periodo"
  [immersive]="routeFlags().flow"
  [wideContent]="routeFlags().listDetail"
>
  <cc-period-chip
    ccShellPeriod
    [title]="periods.title()"
    [range]="periods.rangeText()"
    [canShift]="periods.canShift()"
    (previous)="periods.previous()"
    (next)="periods.next()"
    (opened)="choosePeriod()"
  />
  <cc-icon-button
    ccShellActions
    icon="settings"
    label="Configuración"
    [link]="['/', paths.settings]"
  />
  <router-outlet />
</cc-app-shell>
