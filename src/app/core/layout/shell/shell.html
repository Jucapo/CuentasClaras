<header class="shell-header">
  <div class="header-content">
    <div class="total">
      <span class="total-label">Total</span>
      <!-- TODO: replace with the accounts total (F1). -->
      <span class="total-value">—</span>
    </div>

    <div class="period" role="group" aria-label="Periodo">
      <!-- TODO: period selector with bottom sheet (F1). -->
      <button matIconButton type="button" disabled aria-label="Periodo anterior">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button matButton="tonal" type="button" class="period-chip" disabled>Este mes</button>
      <button matIconButton type="button" disabled aria-label="Periodo siguiente">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>

    <a
      matIconButton
      [routerLink]="['/', paths.settings]"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      aria-label="Configuración"
    >
      <mat-icon>settings</mat-icon>
    </a>
  </div>
</header>

<main class="shell-content">
  <router-outlet />
</main>

<nav class="bottom-nav" aria-label="Navegación principal">
  <ul class="nav-list">
    @for (item of navItems; track item.path) {
      <li>
        <a
          class="nav-item"
          matRipple
          [routerLink]="['/', item.path]"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <span class="nav-indicator">
            <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          </span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
